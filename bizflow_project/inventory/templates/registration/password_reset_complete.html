{% extends "registration/auth_base.html" %}

{% block title %}Password Reset Complete - BizFlow{% endblock %}

{% block auth_content %}
<div class="auth-body slide-up text-center">
    <div class="success-icon mb-4">
        <i class="fas fa-check-circle fa-4x" style="color: var(--success-color);"></i>
    </div>
    
    <h3 class="mb-3" style="color: #2d3748;">Password Reset Complete</h3>
    <p class="text-muted mb-4">
        Your password has been successfully reset. You can now log in with your new password.
    </p>

    <div class="auth-footer">
        <a href="{% url 'login' %}" class="btn-auth btn-primary">
            <i class="fas fa-sign-in-alt me-2"></i>Login Now
        </a>
    </div>
</div>
{% endblock %}
