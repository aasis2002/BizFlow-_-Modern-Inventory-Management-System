{% extends "registration/auth_base.html" %}

{% block title %}Reset Password - BizFlow{% endblock %}

{% block auth_content %}
<div class="auth-body slide-up">
    <h3 class="text-center mb-4" style="color: #2d3748;">Reset Password</h3>
    <p class="text-center text-muted mb-4">Enter your email address and we'll send you instructions to reset your password.</p>

    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="email" class="form-label">
                <i class="fas fa-envelope me-2"></i>Email Address
            </label>
            <input type="email" class="form-control" id="email" name="email" 
                   placeholder="Enter your email address" required>
            <i class="fas fa-envelope input-icon"></i>
        </div>

        <button type="submit" class="btn-auth btn-primary">
            <i class="fas fa-paper-plane me-2"></i>Send Reset Instructions
        </button>
    </form>

    <div class="auth-footer">
        <p class="mb-0">
            <a href="{% url 'login' %}" class="auth-link">
                <i class="fas fa-arrow-left me-1"></i>Back to Login
            </a>
        </p>
    </div>
</div>
{% endblock %}
